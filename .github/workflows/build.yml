name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: 'Game Folder/Name (e.g., TinyThor)'
        required: true
        default: 'TinyThor'
      nsp_url:
        description: 'Direct NSP Download URL'
        required: true
      nsp_filename:
        description: 'Target NSP Filename with brackets'
        required: true
        default: 'Tiny Thor [010002401AE94000].nsp'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$X" ]; then X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1); fi
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Python Dependencies
        run: |
          PYLZ4_USE_SYSTEM_LZ4=0 python3 -m pip install --no-binary lz4 lz4 capstone fonttools backports.zstd --break-system-packages

      - name: Set up Keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p ~/.switch
          echo "$PROD_KEYS" > ~/.switch/prod.keys
          echo "$PROD_KEYS" > ~/.switch/title.keys

      - name: Download Game File
        run: |
          mkdir -p "${{ github.event.inputs.game_name }}"
          curl -L "${{ github.event.inputs.nsp_url }}" -o "${{ github.event.inputs.game_name }}/${{ github.event.inputs.nsp_filename }}"

      - name: Install Tools
        run: |
          brew install xcodegen spirv-cross glslang zstd || true

      - name: Fix Script
        run: |
          sed -i '' "s|'cd .. && xcodegen generate && cd pkg && xcodebuild -project ../DmIOS.xcodeproj'|'xcodebuild'|" scripts/build_ipa_from_nsp.py
          find . -type f -name "*.py" -exec sed -i '' 's/-fmetal-math-mode=relaxed//g' {} +
          find . -type f -name "*.py" -exec sed -i '' 's/fmetal-math-mode=relaxed//g' {} +

      - name: Create Tool Wrappers
        run: |
          mkdir -p bin_override
          ln -sf "$(which xcodegen)" bin_override/xcodegen
          GLSLANG_PATH=$(find /opt/homebrew /usr/local -name "glslangValidator" 2>/dev/null | head -n 1)
          if [ -n "$GLSLANG_PATH" ]; then
            ln -sf "$GLSLANG_PATH" bin_override/glslangValidator
          else
            printf '%s\n' '#!/bin/bash' 'exit 0' > bin_override/glslangValidator
          fi
          chmod +x bin_override/glslangValidator
          printf '%s\n' '#!/bin/bash' 'args=()' 'for arg in "$@"; do' '  if [[ "$arg" != *"-fmetal-math-mode=relaxed"* ]]; then args+=("$arg"); fi' 'done' 'exec /usr/bin/xcrun metal "${args[@]}"' > bin_override/metal
          chmod +x bin_override/metal

      - name: Build Game IPA
        run: |
          PYTHON_BIN_DIR=$(dirname "$(which python3)")
          export PATH="$(pwd)/bin_override:$PYTHON_BIN_DIR:/opt/homebrew/bin:/usr/local/bin:$PATH"
          python3 scripts/build_ipa_from_nsp.py "${{ github.event.inputs.game_name }}" -k ~/.switch/prod.keys

      - name: Show Logs On Failure
        if: failure()
        run: |
          tail -n 60 "${{ github.event.inputs.game_name }}"/*_build/ipa/build/ios/pkg/build.log || true
          tail -n 40 "${{ github.event.inputs.game_name }}"/*_build/logs/build_ipa.log || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-game-ipa
          path: |
            **/*.ipa
            **/*.app
