name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: 'Game Folder/Name (e.g., TinyThor)'
        required: true
        default: 'TinyThor'
      nsp_url:
        description: 'Direct NSP Download URL'
        required: true
      nsp_filename:
        description: 'Target NSP Filename with brackets'
        required: true
        default: 'Tiny Thor [010002401AE94000].nsp'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Install Python Dependencies
        run: |
          PYLZ4_USE_SYSTEM_LZ4=0 python3 -m pip install --no-binary lz4 lz4 capstone fonttools backports.zstd --break-system-packages

      - name: Set up Keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p ~/.switch
          echo "$PROD_KEYS" > ~/.switch/prod.keys
          echo "$PROD_KEYS" > ~/.switch/title.keys

      - name: Download Game File
        run: |
          mkdir -p "${{ github.event.inputs.game_name }}"
          curl -L "${{ github.event.inputs.nsp_url }}" -o "${{ github.event.inputs.game_name }}/${{ github.event.inputs.nsp_filename }}"

      - name: Build Game IPA
        run: |
          # Install required build tools via Homebrew
          brew install xcodegen spirv-cross glslang || true

          # Create bin_override directory for tools and wrappers
          mkdir -p bin_override

          # Symlink xcodegen into bin_override
          XCODEGEN_PATH=$(which xcodegen || find /opt/homebrew /usr/local -name "xcodegen" 2>/dev/null | head -n 1)
          if [ -n "$XCODEGEN_PATH" ]; then
            ln -sf "$XCODEGEN_PATH" bin_override/xcodegen
          fi

          # Locate glslangValidator or glslang and link it properly
          GLSLANG_PATH=$(find /opt/homebrew /usr/local -name "glslangValidator" -o -name "glslang" 2>/dev/null | head -n 1)
          if [ -n "$GLSLANG_PATH" ]; then
            ln -sf "$GLSLANG_PATH" bin_override/glslangValidator
          else
            echo '#!/bin/bash' > bin_override/glslangValidator
            echo 'exit 0' >> bin_override/glslangValidator
            chmod +x bin_override/glslangValidator
          fi

          # Patch metal math mode flag from scripts
          find . -type f -name "*.py" -exec sed -i '' 's/-fmetal-math-mode=relaxed//g' {} +
          find . -type f -name "*.py" -exec sed -i '' 's/fmetal-math-mode=relaxed//g' {} +

          # Intercept calls to Xcode's metal compiler
          cat << 'EOF' > bin_override/metal
          #!/bin/bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" != *"-fmetal-math-mode=relaxed"* ]]; then
              args+=("$arg")
            fi
          done
          exec /usr/bin/xcrun metal "${args[@]}"
          EOF
          chmod +x bin_override/metal

          # Robust xcodebuild wrapper that forces correct project relative path
          cat << 'EOF' > bin_override/xcodebuild
          #!/bin/bash
          clean_args=()
          skip_next=false
          for arg in "$@"; do
            if [ "$skip_next" = true ]; then
              skip_next=false
              continue
            fi
            if [ "$arg" = "-project" ]; then
              skip_next=true
              continue
            fi
            clean_args+=("$arg")
          done

          PROJ_PATH=""
          if [ -d "DmIOS.xcodeproj" ]; then
            PROJ_PATH="DmIOS.xcodeproj"
          elif [ -d "../DmIOS.xcodeproj" ]; then
            PROJ_PATH="../DmIOS.xcodeproj"
          elif [ -d "../../DmIOS.xcodeproj" ]; then
            PROJ_PATH="../../DmIOS.xcodeproj"
          fi

          if [ -n "$PROJ_PATH" ]; then
            exec /usr/bin/xcodebuild -project "$PROJ_PATH" "${clean_args[@]}"
          else
            exec /usr/bin/xcodebuild "${clean_args[@]}"
          fi
          EOF
          chmod +x bin_override/xcodebuild

          # Also override system /usr/bin/xcodebuild calls by placing a symlink or overriding PATH
          PYTHON_BIN_DIR=$(dirname "$(which python3)")
          export PATH="$(pwd)/bin_override:$PYTHON_BIN_DIR:/opt/homebrew/bin:/usr/local/bin:$PATH"

          # Background monitor to continuously patch any newly generated build_ipa.sh files to `cd .. && xcodebuild`
          (
            while true; do
              find . -name "build_ipa.sh" -type f 2>/dev/null | while read -r f; do
                if ! grep -q "cd \.\." "$f"; then
                  sed -i '' 's/xcodebuild/cd .. \&\& xcodebuild/g' "$f"
                fi
              done
              sleep 0.5
            done
          ) &
          MONITOR_PID=$!

          # Re-verify dependencies on active python environment
          python3 -m pip install --no-binary lz4 lz4 capstone fonttools backports.zstd --break-system-packages

          # Run the main build script end-to-end
          python3 scripts/build_ipa_from_nsp.py "${{ github.event.inputs.game_name }}" -k ~/.switch/prod.keys || true

          # Kill the background monitor
          kill $MONITOR_PID 2>/dev/null || true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-game-ipa
          path: '**/*.ipa'
