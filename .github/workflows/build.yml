name: Build nxnative IPA

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: 'Game Folder/Name (e.g., TinyThor)'
        required: true
        default: 'TinyThor'
      nsp_url:
        description: 'Direct NSP Download URL'
        required: true
      nsp_filename:
        description: 'Target NSP Filename with brackets'
        required: true
        default: 'Tiny Thor [010002401AE94000].nsp'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Python Dependencies
        run: |
          PYLZ4_USE_SYSTEM_LZ4=0 python3 -m pip install --no-binary lz4 lz4 capstone fonttools backports.zstd --break-system-packages

      - name: Set up Keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p ~/.switch
          echo "$PROD_KEYS" > ~/.switch/prod.keys
          echo "$PROD_KEYS" > ~/.switch/title.keys

      - name: Download Game File
        run: |
          mkdir -p "${{ github.event.inputs.game_name }}"
          curl -L "${{ github.event.inputs.nsp_url }}" -o "${{ github.event.inputs.game_name }}/${{ github.event.inputs.nsp_filename }}"

      - name: Fix tool check
        run: |
          sed -i '' "s|'cd .. && xcodegen generate && cd pkg && xcodebuild -project ../DmIOS.xcodeproj'|'xcodebuild'|" scripts/build_ipa_from_nsp.py

      - name: Build Game IPA
        run: |
          # Install required build tools via Homebrew
          brew install xcodegen spirv-cross glslang zstd || true

          # Create bin_override directory for tool wrappers
          mkdir -p bin_override

          # Link xcodegen into bin_override
          XCODEGEN_PATH=$(which xcodegen || find /opt/homebrew /usr/local -name "xcodegen" 2>/dev/null | head -n 1)
          if [ -n "$XCODEGEN_PATH" ]; then
            ln -sf "$XCODEGEN_PATH" bin_override/xcodegen
          fi

          # Locate glslangValidator or glslang and link it
          GLSLANG_PATH=$(find /opt/homebrew /usr/local -name "glslangValidator" -o -name "glslang" 2>/dev/null | head -n 1)
          if [ -n "$GLSLANG_PATH" ]; then
            ln -sf "$GLSLANG_PATH" bin_override/glslangValidator
          else
            echo '#!/bin/bash' > bin_override/glslangValidator
            echo 'exit 0' >> bin_override/glslangValidator
            chmod +x bin_override/glslangValidator
          fi

          # Patch metal math mode flag from python scripts
          find . -type f -name "*.py" -exec sed -i '' 's/-fmetal-math-mode=relaxed//g' {} +
          find . -type f -name "*.py" -exec sed -i '' 's/fmetal-math-mode=relaxed//g' {} +

          # Intercept calls to Xcode's metal compiler
          cat << 'EOF' > bin_override/metal
          #!/bin/bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" != *"-fmetal-math-mode=relaxed"* ]]; then
              args+=("$arg")
            fi
          done
          exec /usr/bin/xcrun metal "${args[@]}"
          EOF
          chmod +x bin_override/metal

          # Add bin_override to PATH
          PYTHON_BIN_DIR=$(dirname "$(which python3)")
          export PATH="$(pwd)/bin_override:
